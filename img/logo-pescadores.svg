  <circle cx="60" cy="36" r="10" fill="url(#goldGrad)" opacity="0.9"/>
  <!-- Traditional Wooden Fisherman Boat Hull & Canopy -->
  <path d="M32 62 H88 L82 48 H38 L32 62 Z" stroke="#E0F2FE" stroke-width="2.5" stroke-linejoin="round" fill="rgba(56,189,248,0.15)"/>
  <path d="M24 65 L34 80 H86 L96 65 Q60 71 24 65 Z" fill="url(#goldGrad)"/>
  <path d="M60 36 V62" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Waves -->
  <path d="M22 86 Q35 79 48 86 T74 86 T98 86" stroke="url(#waveGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M30 95 Q45 89 60 95 T90 95" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.7" fill="none"/>
</svg>
